name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows-slice:
    name: Verify Windows vertical slice
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4
        with:
          global-json-file: global.json

      - name: Install pinned Swift toolchain
        shell: pwsh
        run: >-
          winget install
          --id Swift.Toolchain
          --exact
          --version 6.3.3
          --source winget
          --silent
          --disable-interactivity
          --accept-source-agreements
          --accept-package-agreements

      - name: Run repository checks
        shell: pwsh
        run: ./eng/check.ps1

      - name: Upload validated sample IR
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchard-sample-ir
          path: |
            artifacts/validation/hello.orchard.json
            artifacts/validation/native-hello.orchard.json
          if-no-files-found: ignore
          retention-days: 7
